</html>
<button id="downloadBtn" style="display:none;">
  Install Hypercrafts
</button>

<script>
  let deferredPrompt;

  // Browser says: "PWA can be installed"
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;

    // Show your button
    document.getElementById('downloadBtn').style.display = 'block';
  });

  // User clicks your button
  document.getElementById('downloadBtn').addEventListener('click', () => {
    if (deferredPrompt) {
      deferredPrompt.prompt(); // Show install popup

      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
      });
    }
  });
</script>
